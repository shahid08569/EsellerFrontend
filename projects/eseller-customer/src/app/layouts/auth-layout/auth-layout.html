<div class="min-h-screen flex flex-col justify-between bg-gradient-to-b from-gray-50 via-white to-gray-50 p-3 sm:p-5">
  
  <!-- TOP BAR: ALL 3 ELEMENTS IN ONE SINGLE LINE -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between gap-2 sm:gap-4 py-2 px-2 sm:px-4 shrink-0">
    
    <!-- 1. LEFT: Logo (white mark on rose chip — same size) -->
    <a routerLink="/" class="flex items-center gap-2 group shrink-0">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-primary flex items-center justify-center shadow-xs group-hover:scale-105 transition-transform overflow-hidden">
        <img src="/brand/eseller-global-nav.png?v=orange3" alt="EsellerGlobal" class="h-6 w-6 sm:h-7 sm:w-7 object-contain brightness-0 invert" />
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-lg sm:text-2xl font-black text-text-primary tracking-tight">Eseller</span>
        <span class="hidden md:inline-block text-[9px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-primary/10 text-primary">Marketplace</span>
      </div>
    </a>

    <!-- 2. CENTER: Switcher Tabs (All in the same horizontal bar) -->
    <nav class="inline-flex items-center p-1 bg-gray-100/90 rounded-full border border-gray-200/80 shadow-2xs text-xs font-bold shrink-0">
      <a
        routerLink="/auth/login"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="auth-nav-pill px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-full flex items-center gap-1 cursor-pointer"
      >
        <span>Sign In</span>
      </a>

      <a
        routerLink="/auth/register"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="auth-nav-pill px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-full flex items-center gap-1.5 cursor-pointer"
      >
        <span>🛍️ Customer Account</span>
        <span class="hidden sm:inline-block text-[9px] bg-primary/10 text-primary font-black px-1.5 py-0.2 rounded-full uppercase">Shopper</span>
      </a>

      <a
        routerLink="/auth/seller-register"
        routerLinkActive="active-seller-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="auth-nav-pill px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-full flex items-center gap-1.5 cursor-pointer"
      >
        <span>🏪</span>
        <span>Seller Registration</span>
        <span class="merchant-badge hidden sm:inline-block text-[9px] bg-amber-400 text-gray-950 font-black px-1.5 py-0.2 rounded-full uppercase">Merchant Pro</span>
      </a>
    </nav>

    <!-- 3. RIGHT: Back to Store Button -->
    <a
      routerLink="/"
      class="inline-flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full bg-white border border-gray-200 text-xs font-bold text-text-secondary hover:text-text-primary hover:border-gray-300 shadow-2xs transition-all cursor-pointer shrink-0"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
      </svg>
      <span class="hidden sm:inline">Back to Store</span>
    </a>
  </header>

  <!-- Auth Content Container (Vertically centered, compact padding) -->
  <main class="w-full max-w-6xl mx-auto my-auto py-2 sm:py-3 px-1 sm:px-2">
    <router-outlet />
  </main>

  <!-- Full-width rose footer + white logo -->
  <footer class="w-full mt-4 bg-primary text-white">
    <div class="max-w-6xl mx-auto px-4 py-5 flex flex-col sm:flex-row items-center justify-between gap-3">
      <a routerLink="/" class="inline-flex items-center gap-2">
        <img src="/brand/eseller-global-nav.png?v=orange3" alt="EsellerGlobal" class="h-10 w-auto object-contain brightness-0 invert" />
        <span class="text-sm font-semibold text-white/95">EsellerGlobal</span>
      </a>
      <p class="text-[11px] text-white/80 text-center sm:text-right">
        &copy; 2026 Eseller Multi-Vendor Marketplace. 256-Bit SSL Encrypted.
      </p>
    </div>
  </footer>

</div>

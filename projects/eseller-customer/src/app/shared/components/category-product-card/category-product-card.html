<div
  (click)="onCardClick()"
  class="group relative bg-white rounded-lg border border-gray-200 overflow-hidden cursor-pointer my-2 shadow-none hover:shadow-md transition-shadow duration-200 flex flex-col h-full"
>

  <!-- IMAGE (fixed aspect) -->
  <div class="relative aspect-square bg-white overflow-hidden flex-shrink-0">

    @if (getImageUrl(product().primaryImageUrl); as imgUrl) {
      <img
        [src]="imgUrl"
        [alt]="product().name"
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
        loading="lazy"
      />
    } @else {
      <div class="w-full h-full flex items-center justify-center text-gray-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z" />
        </svg>
      </div>
    }

    <!-- Wishlist -->
    <button
      type="button"
      (click)="onAddToWishlist($event)"
      class="absolute top-3 right-3 w-9 h-9 rounded-full bg-white border border-gray-200 flex items-center justify-center hover:bg-primary hover:border-primary hover:text-white text-gray-500 transition-colors"
      aria-label="Add to wishlist"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
      </svg>
    </button>

  </div>

  <!-- CONTENT (fixed height) -->
  <div class="p-4 flex flex-col flex-1">

    <!-- Price (rose, bold) -->
    <p class="text-lg font-bold text-primary mb-2 tabular-nums">
      ${{ formattedPrice() }}
    </p>

    <!-- Stars — full / half / empty based on rating -->
    <div class="flex items-center gap-0.5 mb-2">
      @for (star of stars; track star) {
        <div class="relative w-4 h-4">

          <!-- Base (grey / empty) -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="absolute inset-0 w-4 h-4 text-gray-300"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>

          <!-- Full star (yellow) -->
          @if (star <= ratingValue()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="absolute inset-0 w-4 h-4 text-yellow-400"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
          }
          <!-- Half star (yellow left half) -->
          @else if (star - 0.5 <= ratingValue()) {
            <div class="absolute inset-y-0 left-0 w-1/2 overflow-hidden">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 text-yellow-400"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
              </svg>
            </div>
          }

        </div>
      }

      <!-- Rating number -->
      <span class="text-xs text-text-secondary ml-1 tabular-nums">
        {{ ratingDisplay() }}
      </span>
    </div>

    <!-- Product name (fixed 2 lines) -->
    <h3
      class="text-[15px] text-text-primary leading-snug line-clamp-2 min-h-[2.5rem]"
      [title]="fullName()"
    >
      {{ product().name }}
    </h3>

  </div>

</div>

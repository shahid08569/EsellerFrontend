<div 
  [class]="fullscreen() 
    ? 'fixed inset-0 z-50 flex items-center justify-center p-4 animate-in fade-in duration-200' 
    : 'absolute inset-0 z-30 flex items-center justify-center rounded-2xl p-4 animate-in fade-in duration-200'"
  [style.backdrop-filter]="fullscreen() ? 'blur(20px)' : 'blur(16px)'"
  [style.-webkit-backdrop-filter]="fullscreen() ? 'blur(20px)' : 'blur(16px)'"
  [style.background]="fullscreen() ? 'rgba(15, 23, 42, 0.65)' : 'rgba(255, 255, 255, 0.65)'"
  role="status"
  aria-live="polite">
  <div class="inline-flex items-center gap-3.5 px-5 py-3.5 rounded-2xl shadow-2xl transition-all duration-200"
       style="background: #ffffff !important; border: 1.5px solid rgba(244, 63, 94, 0.3) !important; box-shadow: 0 20px 45px -10px rgba(244, 63, 94, 0.25), 0 0 0 1px rgba(249, 115, 22, 0.18) !important;">
    <!-- Dual-orbit spinner in Rose & Orange -->
    <div class="relative w-9 h-9 shrink-0 flex items-center justify-center">
      <!-- Outer gradient arc -->
      <div class="absolute inset-0 rounded-full es-cool-orbit"
           style="border: 2.5px solid transparent !important; border-top-color: #f43f5e !important; border-right-color: #f97316 !important;"></div>
      <!-- Inner dashed counter-spinning ring -->
      <div class="absolute inset-1 rounded-full es-cool-orbit-rev"
           style="border: 1.5px dashed #fb923c !important;"></div>
      <!-- Core pulsing dot -->
      <div class="w-2.5 h-2.5 rounded-full es-cool-core"
           style="background: linear-gradient(135deg, #f43f5e 0%, #f97316 60%, #fbbf24 100%) !important; box-shadow: 0 0 10px rgba(244, 63, 94, 0.9) !important;"></div>
    </div>

    <!-- Typography & Animated Dots -->
    <div class="flex flex-col text-left">
      <div class="flex items-center gap-0.5 text-xs font-black tracking-wide" style="color: #0f172a !important;">
        <span>{{ text() }}</span>
        <span class="inline-flex tracking-tighter ml-0.5 font-bold" style="color: #f43f5e !important;">
          <span class="es-dot-1">.</span>
          <span class="es-dot-2">.</span>
          <span class="es-dot-3">.</span>
        </span>
      </div>
      @if (subtext()) {
        <span class="text-[10px] font-medium tracking-tight mt-0.5" style="color: #64748b !important;">{{ subtext() }}</span>
      }
    </div>
  </div>
</div>

@if (categories().length > 0) {
  <section class="w-full bg-white rounded-[24px] py-6 md:py-8 px-4 md:px-6 border border-gray-100 shadow-xs relative overflow-hidden">

    <!-- Header -->
    <div class="flex items-end justify-between gap-4 mb-6 md:mb-8">
      <div class="flex-1 min-w-0">
        <h2 class="text-xl md:text-2xl lg:text-3xl font-extrabold text-text-primary tracking-tight">
          What are you shopping for today?
        </h2>
        <div class="w-16 md:w-20 h-1 bg-primary rounded-full mt-2"></div>
      </div>

      <a
        routerLink="/categories"
        class="flex-shrink-0 inline-flex items-center gap-1.5 text-primary hover:text-primary-hover text-xs sm:text-sm font-bold transition-colors group/link cursor-pointer"
      >
        <span>View All</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 transition-transform group-hover/link:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </a>
    </div>

    <!-- Continuous Infinite Draggable Marquee -->
    <div class="w-full overflow-hidden">
      <div
        #scrollContainer
        class="categories-marquee-container w-full overflow-x-hidden no-scrollbar cursor-grab active:cursor-grabbing select-none"
        (mouseenter)="onMouseEnter()"
        (mouseleave)="onMouseLeave()"
        (mousedown)="onMouseDown($event)"
        (touchstart)="onTouchStart($event)"
        (touchmove)="onTouchMove($event)"
        (touchend)="onTouchEnd()"
        (touchcancel)="onTouchEnd()"
      >
        <div #trackContainer class="relative flex items-center gap-4 sm:gap-5 md:gap-6 w-max py-2 px-1">
          @for (category of sliderCategories(); track $index) {
            <a
              [routerLink]="['/categories', category.slug]"
              (click)="onCategoryClick($event)"
              (dragstart)="$event.preventDefault()"
              draggable="false"
              class="w-28 sm:w-32 md:w-36 flex-shrink-0 group cursor-pointer bg-gradient-to-b from-gray-50/90 via-white to-white hover:from-rose-50/70 hover:via-white hover:to-white border border-gray-200/80 hover:border-primary/40 rounded-2xl p-3 sm:p-3.5 shadow-card hover:shadow-card-hover hover:-translate-y-0.5 transition-all duration-300 flex flex-col items-center gap-2.5 select-none"
            >
              <!-- Circle image frame -->
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white p-1.5 shadow-xs group-hover:scale-110 group-hover:shadow-sm transition-all duration-300 flex items-center justify-center border border-gray-100 group-hover:border-primary/30 overflow-hidden">
                @if (getImageUrl(category); as imgUrl) {
                  <img
                    [src]="imgUrl"
                    [alt]="category.name"
                    (dragstart)="$event.preventDefault()"
                    draggable="false"
                    class="w-full h-full object-cover rounded-full transition-transform duration-300 pointer-events-none select-none"
                    loading="lazy"
                    (error)="$any($event.target).src=categoryImageFallback(category.slug, category.name) || '/brand/eseller-mark.svg'"
                  />
                } @else {
                  <img
                    src="/brand/eseller-mark.svg"
                    [alt]="category.name"
                    class="w-10 h-10 object-contain rounded-xl pointer-events-none select-none"
                    loading="lazy"
                  />
                }
              </div>

              <!-- Name -->
              <span class="text-xs sm:text-sm font-bold text-text-primary group-hover:text-primary transition-colors text-center line-clamp-1 truncate w-full select-none">
                {{ category.name }}
              </span>

              <!-- Shop now tag -->
              <span class="text-[10px] text-text-muted font-semibold group-hover:text-primary transition-colors inline-flex items-center gap-0.5 select-none">
                Shop now
                <span class="transition-transform group-hover:translate-x-0.5">&rarr;</span>
              </span>
            </a>
          }
        </div>
      </div>
    </div>

  </section>
} @else {
  <!-- SKELETON -->
  <section class="w-full bg-white rounded-[24px] py-6 md:py-8 px-4 md:px-6 border border-gray-100 shadow-xs">
    <div class="mb-6 md:mb-8">
      <div class="h-7 bg-gray-200 rounded w-1/3 mb-2 animate-pulse"></div>
      <div class="w-16 md:w-20 h-1 bg-gray-200 rounded-full animate-pulse"></div>
    </div>
    <div class="flex gap-4 overflow-x-hidden no-scrollbar pb-2">
      @for (i of [1,2,3,4,5,6,7]; track i) {
        <div class="w-32 flex-shrink-0 bg-gray-50 rounded-2xl p-4 flex flex-col items-center gap-3 animate-pulse">
          <div class="w-16 h-16 rounded-full bg-gray-200"></div>
          <div class="h-3 w-16 bg-gray-200 rounded"></div>
        </div>
      }
    </div>
  </section>
}

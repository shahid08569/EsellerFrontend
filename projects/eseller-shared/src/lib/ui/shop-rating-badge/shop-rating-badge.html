<span
  class="inline-flex items-center flex-wrap gap-1.5 min-w-0 max-w-full"
  [class.text-[11px]]="size() === 'sm'"
  [class.text-xs]="size() === 'md'">

  @if (showName() && shopName()) {
    <span
      class="font-bold text-slate-800 truncate max-w-[10rem] sm:max-w-[14rem]"
      [title]="shopName()">
      {{ shopName() }}
    </span>
  }

  @if (showVerified()) {
    <span
      class="inline-flex items-center gap-0.5 shrink-0 rounded-full border border-emerald-200 bg-emerald-50 text-emerald-700 font-extrabold uppercase tracking-wide"
      [class.px-1.5]="true"
      [class.py-0.5]="true"
      [class.text-[9px]]="size() === 'sm'"
      [class.text-[10px]]="size() === 'md'">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-emerald-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
      </svg>
      Verified
    </span>
  }

  @if (hasRating()) {
    <span
      class="inline-flex items-center gap-0.5 shrink-0 rounded-full border border-amber-200/90 bg-amber-50 px-1.5 py-0.5"
      [attr.title]="'Store rating ' + safeRating() + ' / 5'"
      aria-label="Store rating {{ safeRating() }} out of 5">
      <span class="inline-flex items-center text-amber-400">
        @for (s of stars; track s) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-3 h-3"
            [class.text-amber-400]="isFilled(s)"
            [class.fill-current]="isFilled(s)"
            [class.text-amber-200]="!isFilled(s)">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
        }
      </span>
      <span class="tabular-nums font-black text-amber-800 text-[10px] leading-none">
        {{ safeRating() | number:'1.1-1' }}
      </span>
    </span>
  }
</span>

<div
  (click)="onCardClick()"
  class="group relative bg-white rounded-2xl border border-gray-200/90 hover:border-primary/50 shadow-card hover:shadow-card-hover hover:-translate-y-0.5 transition-all duration-300 flex flex-col h-full overflow-hidden cursor-pointer"
>

  <!-- IMAGE (fixed aspect, edge-to-edge, overflow-hidden) -->
  <div class="relative w-full aspect-square bg-gray-50 overflow-hidden flex-shrink-0">

    @if (getImageUrl(product().primaryImageUrl); as imgUrl) {
      <img
        [src]="imgUrl"
        [alt]="product().name"
        class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105 pointer-events-none"
        loading="lazy"
      />
    } @else {
      <div class="w-full h-full flex items-center justify-center text-gray-300 bg-gray-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z" />
        </svg>
      </div>
    }

    <!-- Quick Actions (top-right, crisp circular buttons) -->
    <div class="absolute top-2.5 right-2.5 flex flex-col gap-1.5 z-20">
      
      <!-- Wishlist Button -->
      <button
        type="button"
        (click)="onAddToWishlist($event)"
        [class.opacity-100]="isInWishlist()"
        [class.opacity-0]="!isInWishlist()"
        [class.bg-rose-50]="isInWishlist()"
        [class.border-primary]="isInWishlist()"
        [class.text-primary]="isInWishlist()"
        [class.bg-white/95]="!isInWishlist()"
        [class.border-gray-200]="!isInWishlist()"
        [class.text-gray-700]="!isInWishlist()"
        class="w-8 h-8 rounded-full backdrop-blur-xs border flex items-center justify-center group-hover:opacity-100 hover:bg-primary hover:border-primary hover:text-white shadow-2xs transition-all hover:scale-105 cursor-pointer"
        aria-label="Wishlist"
        [title]="isInWishlist() ? 'In Wishlist (Click to remove)' : 'Add to Wishlist'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 transition-colors" [class.fill-current]="isInWishlist()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </button>

      <!-- Compare Button -->
      <button
        type="button"
        (click)="onAddToCompare($event)"
        [class.opacity-100]="isInCompare()"
        [class.opacity-0]="!isInCompare()"
        [class.bg-rose-50]="isInCompare()"
        [class.border-primary]="isInCompare()"
        [class.text-primary]="isInCompare()"
        [class.bg-white/95]="!isInCompare()"
        [class.border-gray-200]="!isInCompare()"
        [class.text-gray-700]="!isInCompare()"
        class="w-8 h-8 rounded-full backdrop-blur-xs border flex items-center justify-center group-hover:opacity-100 hover:bg-primary hover:border-primary hover:text-white shadow-2xs transition-all hover:scale-105 cursor-pointer"
        aria-label="Compare"
        [title]="isInCompare() ? 'In Compare (Click to remove)' : 'Compare'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
        </svg>
      </button>

      <!-- Add to Cart Button -->
      <button
        type="button"
        (click)="onAddToCart($event)"
        [class.opacity-100]="isInCart()"
        [class.opacity-0]="!isInCart()"
        [class.bg-rose-50]="isInCart()"
        [class.border-primary]="isInCart()"
        [class.text-primary]="isInCart()"
        [class.bg-white/95]="!isInCart()"
        [class.border-gray-200]="!isInCart()"
        [class.text-gray-700]="!isInCart()"
        class="w-8 h-8 rounded-full backdrop-blur-xs border flex items-center justify-center group-hover:opacity-100 hover:bg-primary hover:border-primary hover:text-white shadow-2xs transition-all hover:scale-105 cursor-pointer"
        aria-label="Cart"
        [title]="isInCart() ? 'In Cart (Click to remove)' : 'Add to Cart'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" [class.fill-current]="isInCart()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
        </svg>
      </button>

    </div>

  </div>

  <!-- CONTENT -->
  <div class="p-3.5 sm:p-4 flex flex-col flex-1 justify-between bg-white border-t border-gray-100">

    <div class="space-y-1.5">
      <!-- Stars rating row -->
      <div class="flex items-center gap-1">
        <div class="flex items-center gap-0.5">
          @for (star of stars; track star) {
            <div class="relative w-3.5 h-3.5">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="absolute inset-0 w-3.5 h-3.5 text-gray-300"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
              </svg>

              @if (star <= ratingValue()) {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="absolute inset-0 w-3.5 h-3.5 text-yellow-400"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
              } @else if (star - 0.5 <= ratingValue()) {
                <div class="absolute inset-y-0 left-0 w-1/2 overflow-hidden">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-3.5 h-3.5 text-yellow-400"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                  </svg>
                </div>
              }
            </div>
          }
        </div>

        <span class="text-[11px] font-bold text-amber-500 tabular-nums ml-0.5">
          {{ ratingDisplay() }}
        </span>
      </div>

      <!-- Product name (fixed 2 lines) -->
      <h3
        class="text-xs sm:text-sm font-semibold text-text-primary group-hover:text-primary transition-colors leading-snug line-clamp-2 min-h-[2.5rem]"
        [title]="fullName()"
      >
        {{ product().name }}
      </h3>
    </div>

    <!-- Price (bottom) -->
    <div class="mt-2.5 pt-2 border-t border-gray-100">
      <div class="flex items-center justify-between gap-1">
        <span class="text-sm sm:text-base font-extrabold text-primary tabular-nums truncate">
          Rs. {{ formattedPrice() }}
        </span>
      </div>
      <div class="min-h-[1.125rem] flex items-center mt-0.5"></div>
    </div>

  </div>

</div>

<section class="w-full bg-white mt-4 rounded-[24px] py-6 md:py-8 px-4 md:px-6 border border-gray-100">

  <!-- HEADER -->
  <div class="flex items-end justify-between gap-4 mb-6 md:mb-8">
    <div class="flex-1 min-w-0">
      <h2 class="text-2xl md:text-2xl lg:text-3xl font-bold text-text-primary tracking-tight mb-2">
        {{ categoryName() }}
      </h2>
      <div class="w-16 md:w-20 h-1 bg-primary rounded-full"></div>
    </div>

    <a
      [routerLink]="viewMoreLink()"
      class="flex-shrink-0 inline-flex items-center gap-1.5 text-primary hover:text-primary-hover text-sm md:text-base font-semibold transition-colors group/link"
    >
      View More
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover/link:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
      </svg>
    </a>
  </div>

  <!-- LOADING SKELETON -->
  @if (loading()) {
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
      @for (i of [1,2,3,4,5]; track i) {
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden animate-pulse">
          <div class="aspect-square bg-gray-200"></div>
          <div class="p-4 space-y-2">
            <div class="h-5 bg-gray-200 rounded w-1/2"></div>
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-4 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
      }
    </div>
  }

  <!-- EMPTY -->
  @else if (products().length === 0) {
    <div class="text-center py-12 px-4 bg-bg-hover rounded-2xl">
      <p class="text-sm text-text-secondary">No products in this category yet.</p>
    </div>
  }

  <!-- PRODUCTS SLIDER -->
  @else {
    <div class="relative">

      <!-- Arrows -->
      <button
        type="button"
        class="cat-prev absolute top-1/2 -left-4 md:-left-5 -translate-y-1/2 z-20 w-10 h-10 md:w-11 md:h-11 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-500 hover:bg-primary hover:border-primary hover:text-white transition-colors cursor-pointer"
        aria-label="Previous"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </button>

      <button
        type="button"
        class="cat-next absolute top-1/2 -right-4 md:-right-5 -translate-y-1/2 z-20 w-10 h-10 md:w-11 md:h-11 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-500 hover:bg-primary hover:border-primary hover:text-white transition-colors cursor-pointer"
        aria-label="Next"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </button>

      <!-- Slider -->
      <div #swiperContainer class="swiper cat-swiper overflow-hidden">
        <div class="swiper-wrapper">
          @for (product of products(); track product.id) {
            <div class="swiper-slide h-auto">
              <app-category-product-card [product]="product" />
            </div>
          }
        </div>
      </div>

    </div>
  }

</section>

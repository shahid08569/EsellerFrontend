<div class="relative w-full text-left" [class.opacity-60]="disabled">
  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled"
    [class]="customClass || 'w-full flex items-center justify-between gap-2 px-3 py-2 bg-slate-50 hover:bg-white border border-slate-200 focus:border-orange-500 rounded-xl text-xs font-semibold text-slate-900 transition-all cursor-pointer shadow-xs'"
    [attr.aria-expanded]="isOpen()">
    <div class="flex items-center gap-2 truncate min-w-0">
      @if (selectedOption(); as opt) {
        @if (opt.flag) {
          <span class="text-sm shrink-0 leading-none">{{ opt.flag }}</span>
        }
        <span class="truncate font-bold text-slate-900">{{ opt.label }}</span>
        @if (opt.sublabel) {
          <span class="text-[10px] text-slate-400 font-normal shrink-0 truncate">({{ opt.sublabel }})</span>
        }
      } @else {
        <span class="text-slate-400 font-medium truncate">{{ placeholder }}</span>
      }
    </div>

    <div class="flex items-center gap-1 shrink-0 text-slate-400">
      @if (allowClear && selectedOption()) {
        <span
          (click)="clear($event)"
          class="p-0.5 hover:text-slate-700 rounded-full hover:bg-slate-200/60 cursor-pointer"
          title="Clear">
          <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </span>
      }
      <svg
        class="w-3.5 h-3.5 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </button>

  <!-- Dropdown Menu -->
  @if (isOpen()) {
    <div
      [class]="menuClass || 'absolute left-0 right-0 mt-1.5 z-50 bg-white rounded-2xl shadow-xl border border-slate-200 p-2 min-w-[200px] animate-in fade-in zoom-in-95 duration-150'">
      <!-- Search Input -->
      <div class="relative mb-1.5">
        <input
          #searchInput
          type="text"
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)"
          [placeholder]="searchPlaceholder"
          class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500"
          (click)="$event.stopPropagation()"
        />
        <svg
          class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <!-- Options List -->
      <div class="max-h-56 overflow-y-auto space-y-0.5 text-xs">
        @if (filteredOptions().length === 0) {
          <div class="px-3 py-4 text-center text-xs text-slate-400 font-medium">
            No matching options
          </div>
        } @else {
          @for (opt of filteredOptions(); track opt.value) {
            <button
              type="button"
              (click)="select(opt, $event)"
              class="w-full px-2.5 py-1.5 rounded-lg flex items-center justify-between text-left transition-colors cursor-pointer group"
              [class.bg-orange-50]="isSelected(opt.value)"
              [class.text-orange-700]="isSelected(opt.value)"
              [class.font-bold]="isSelected(opt.value)"
              [class.hover:bg-slate-100]="!isSelected(opt.value)"
              [class.text-slate-800]="!isSelected(opt.value)">
              <div class="flex items-center gap-2 truncate min-w-0">
                @if (opt.flag) {
                  <span class="text-sm shrink-0 leading-none">{{ opt.flag }}</span>
                }
                <span class="truncate">{{ opt.label }}</span>
                @if (opt.sublabel) {
                  <span class="text-[10px] text-slate-400 font-normal shrink-0 truncate">({{ opt.sublabel }})</span>
                }
              </div>
              @if (isSelected(opt.value)) {
                <svg class="w-3.5 h-3.5 text-orange-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              }
            </button>
          }
        }
      </div>
    </div>
  }
</div>

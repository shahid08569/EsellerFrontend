<div class="relative">
  <button
    type="button"
    (click)="toggleOpen()"
    title="Notifications"
    class="relative p-2 rounded-xl border transition-colors cursor-pointer flex items-center justify-center bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100 dark:bg-slate-800 dark:border-slate-700 dark:text-white">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-rose-600 text-white text-[9px] font-black flex items-center justify-center">
        {{ unreadCount() > 9 ? '9+' : unreadCount() }}
      </span>
    }
  </button>

  @if (isOpen()) {
    <div class="fixed inset-0 z-30" (click)="close()"></div>
    <div class="absolute right-0 mt-2 w-80 bg-white rounded-2xl border border-slate-200 shadow-2xl z-40 overflow-hidden animate-in fade-in duration-150">
      <div class="p-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-900 text-white">
        <p class="text-xs font-black">Notifications</p>
        @if (notifications().length > 0) {
          <button type="button" (click)="markAllRead()" class="text-[11px] font-bold text-emerald-300 hover:text-emerald-200 cursor-pointer">
            Mark all read
          </button>
        }
      </div>

      <div class="max-h-80 overflow-y-auto divide-y divide-slate-50">
        @if (notifications().length === 0) {
          <div class="p-6 text-center text-xs text-slate-400 font-medium">You're all caught up — no unread notifications.</div>
        } @else {
          @for (n of notifications(); track n.id) {
            <button
              type="button"
              (click)="markRead(n)"
              class="w-full text-left p-3.5 hover:bg-slate-50 transition-colors cursor-pointer flex items-start gap-2.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500 mt-1 shrink-0"></span>
              <div class="min-w-0">
                <p class="text-xs font-bold text-slate-900 truncate">{{ n.title }}</p>
                <p class="text-[11px] text-slate-500 line-clamp-2 mt-0.5">{{ n.message }}</p>
                <p class="text-[10px] text-slate-400 mt-1">{{ n.createdAt | date:'short' }}</p>
              </div>
            </button>
          }
        }
      </div>

      <div class="p-2.5 border-t border-slate-100 bg-slate-50 text-center">
        <button type="button" (click)="goToChat()" class="text-[11px] font-bold text-slate-600 hover:text-emerald-700 cursor-pointer">
          Open Admin Support →
        </button>
      </div>
    </div>
  }
</div>

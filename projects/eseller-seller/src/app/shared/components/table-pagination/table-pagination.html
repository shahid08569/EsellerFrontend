<div class="p-4 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-gray-500">
  <div class="flex items-center gap-3">
    <span>
      Showing <span class="font-bold text-gray-900">{{ startItem() }}</span> to <span class="font-bold text-gray-900">{{ endItem() }}</span>
      of <span class="font-bold text-gray-900">{{ total() }}</span> {{ label() }}
    </span>
    <label class="flex items-center gap-1.5">
      <span class="font-semibold text-gray-500">Rows:</span>
      <div class="w-24">
        <es-searchable-select
          [options]="mappedPageSizeOptions()"
          [value]="pageSize()"
          (valueChange)="onPageSizeChange(+$event)"
          customClass="w-full flex items-center justify-between gap-1 px-2.5 py-1 bg-gray-50 hover:bg-white border border-gray-200 rounded-lg text-xs font-bold text-gray-700 cursor-pointer"
          placeholder="Size"
          searchPlaceholder="Search..."
        />
      </div>
    </label>
  </div>

  <div class="flex items-center gap-1.5">
    <button
      type="button"
      (click)="goToPage(page() - 1)"
      [disabled]="page() <= 1"
      class="px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-700 font-bold hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer transition-all">
      ← Previous
    </button>
    <span class="px-2 font-bold text-gray-700">{{ page() }} / {{ totalPages() }}</span>
    <button
      type="button"
      (click)="goToPage(page() + 1)"
      [disabled]="page() >= totalPages()"
      class="px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-700 font-bold hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer transition-all">
      Next →
    </button>
  </div>
</div>

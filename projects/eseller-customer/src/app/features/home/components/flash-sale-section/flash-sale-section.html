@if (loading()) {
  <section class="w-full bg-white rounded-[24px] py-6 md:py-8 px-4 md:px-6 border border-gray-100">
    <div class="flex items-center justify-between mb-4 md:mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 md:w-6 md:h-6 text-primary" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg md:text-xl lg:text-2xl font-bold text-primary tracking-tight">Flash Sale</h2>
          <p class="text-xs md:text-sm text-text-secondary">Limited time offers</p>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5">
      @for (i of [1,2,3,4]; track i) {
        <div class="bg-[#F2F1EC] rounded-[24px] p-3 animate-pulse">
          <div class="aspect-square bg-white rounded-[20px]"></div>
          <div class="px-2 pt-4 space-y-2">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-4 bg-gray-200 rounded w-1/2"></div>
          </div>
        </div>
      }
    </div>
  </section>
}
@else if (hasFlashSale()) {
  <section class="w-full bg-white rounded-[24px] py-6 md:py-8 px-4 md:px-6 border border-gray-100">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-4 md:mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 md:w-6 md:h-6 text-primary" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg md:text-xl lg:text-2xl font-bold text-primary tracking-tight">Flash Sale</h2>
          <p class="text-xs md:text-sm text-text-secondary">Limited time offers</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" class="flash-prev w-9 h-9 md:w-10 md:h-10 rounded-full bg-white hover:bg-primary border border-gray-200 hover:border-primary flex items-center justify-center text-text-primary hover:text-white transition-colors cursor-pointer" aria-label="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>
        <button type="button" class="flash-next w-9 h-9 md:w-10 md:h-10 rounded-full bg-white hover:bg-primary border border-gray-200 hover:border-primary flex items-center justify-center text-text-primary hover:text-white transition-colors cursor-pointer" aria-label="Next">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>
    </div>

    <!-- SLIDER -->
    <div #swiperContainer class="swiper flash-swiper overflow-hidden">
      <div class="swiper-wrapper">
        @for (product of products(); track product.id) {
          <div class="swiper-slide h-auto">
            <es-product-card
              [product]="product"
              [countdownTo]="getCountdown(product)"
              [preferredBadge]="'flash_sale'"
            />
          </div>
        }
      </div>
    </div>

    <div class="flex justify-center mt-6">
      <a [routerLink]="viewAllLink()" class="inline-flex items-center gap-2 px-6 py-2.5 bg-primary text-white text-sm font-medium rounded-full hover:bg-primary-hover transition-colors">
        View All
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </a>
    </div>

  </section>
}

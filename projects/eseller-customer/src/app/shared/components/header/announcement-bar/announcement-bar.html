<div class="bg-primary-active text-white text-xs">
  <div class="max-w-7xl mx-auto px-3 md:px-4 py-2 flex items-center justify-between gap-2">

    <!-- Left: message (truncate on mobile) -->
    <span class="truncate">
      Free shipping on orders over $ 5,000
    </span>

    <!-- Right: quick links (hidden on mobile) -->
    <div class="hidden sm:flex items-center gap-4 flex-shrink-0">
      <a routerLink="/about" class="hover:text-white/80 transition-colors">Help</a>
      @if (canShop()) {
        <a routerLink="/orders" class="hover:text-white/80 transition-colors flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <span>Track Order</span>
        </a>
      }
    </div>

  </div>
</div>

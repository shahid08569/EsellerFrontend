<section class="w-full bg-white rounded-[24px] py-6 md:py-8 mt-4 px-4 md:px-6 border border-gray-100">

  <div class="flex items-center justify-between mb-4 md:mb-6">
    <h2 class="text-lg md:text-xl lg:text-2xl font-bold text-text-primary tracking-tight">
      {{ title() }}
    </h2>
    <a
      [routerLink]="viewAllLink()"
      class="text-sm md:text-base font-medium text-primary hover:text-primary-hover  transition-colors"
    >
      View All →
    </a>
  </div>

  <!-- LOADING SKELETON -->
  @if (loading()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5 lg:gap-6">
      @for (i of [1,2,3,4,5,6,7,8]; track i) {
        <div class="bg-[#F2F1EC] rounded-[24px] p-3 animate-pulse">
          <div class="aspect-square bg-white rounded-[20px]"></div>
          <div class="px-2 pt-4 space-y-2">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            <div class="h-5 bg-gray-200 rounded w-1/3 mt-2"></div>
          </div>
        </div>
      }
    </div>
  }

  <!-- EMPTY -->
  @else if (products().length === 0) {
    <div class="flex flex-col items-center justify-center text-center py-12 px-4 bg-white rounded-2xl border border-gray-100">
      <h3 class="text-base font-semibold text-text-primary mb-1">No products yet</h3>
      <p class="text-sm text-text-secondary">Products will appear here.</p>
    </div>
  }

  <!-- GRID -->
  @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5 lg:gap-6">
      @for (product of products(); track product.id) {
        <es-product-card
  [product]="product"
  [preferredBadge]="'new'"
/>
      }
    </div>
  }

</section>

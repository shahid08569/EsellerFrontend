<div
  (click)="onCardClick()"
  class="group relative bg-white border border-gray-200 shadow-sm hover:shadow-md transition-shadow flex flex-col h-full cursor-pointer overflow-hidden"
>
  <!-- Fixed height + full width image (edge-to-edge) -->
  <div class="relative w-full h-[200px] sm:h-[220px] bg-gray-50 overflow-hidden shrink-0">
    <div class="absolute inset-0 flex items-center justify-center text-gray-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z" />
      </svg>
    </div>
    @if (getImageUrl(product().primaryImageUrl); as imgUrl) {
      <img
        [src]="imgUrl"
        [alt]="product().name"
        class="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-300 group-hover:scale-105 pointer-events-none"
        loading="lazy"
        (error)="$any($event.target).style.visibility='hidden'"
      />
    }

    <!-- Hover actions: wishlist · compare · cart -->
    <div
      class="absolute top-2.5 right-2.5 z-20 flex flex-col gap-2 opacity-100 sm:opacity-0 sm:translate-x-1 sm:group-hover:opacity-100 sm:group-hover:translate-x-0 transition-all duration-300"
      (click)="$event.stopPropagation()">
      <button
        type="button"
        (click)="onAddToWishlist($event)"
        class="w-9 h-9 rounded-full bg-white shadow-md border border-gray-100 flex items-center justify-center transition-all hover:scale-105 hover:border-rose-200 cursor-pointer"
        [class.text-primary]="isInWishlist()"
        [class.text-gray-500]="!isInWishlist()"
        aria-label="Wishlist"
        [title]="isInWishlist() ? 'In Wishlist' : 'Add to Wishlist'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" [class.fill-current]="isInWishlist()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </button>

      <button
        type="button"
        (click)="onAddToCompare($event)"
        class="w-9 h-9 rounded-full bg-white shadow-md border border-gray-100 flex items-center justify-center transition-all hover:scale-105 hover:border-primary/40 cursor-pointer"
        [class.text-primary]="isInCompare()"
        [class.text-gray-500]="!isInCompare()"
        aria-label="Compare"
        [title]="isInCompare() ? 'In Compare' : 'Compare'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
        </svg>
      </button>

      <button
        type="button"
        (click)="onAddToCart($event)"
        class="w-9 h-9 rounded-full bg-white shadow-md border border-gray-100 flex items-center justify-center transition-all hover:scale-105 hover:border-emerald-300 cursor-pointer"
        [class.text-emerald-600]="isInCart()"
        [class.text-gray-500]="!isInCart()"
        aria-label="Add to cart"
        [title]="isInCart() ? 'In Cart' : 'Add to Cart'">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" [class.fill-current]="isInCart()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Price → shop + tier → title (fixed 1-line rows so card height never varies) -->
  <div class="px-3 pt-2.5 pb-3 flex flex-col gap-1.5 flex-1 min-h-[6.75rem]">
    <div class="flex items-baseline gap-2 min-w-0 leading-none">
      <span class="text-[17px] font-bold text-[#E11D2E] tabular-nums truncate">
        ${{ formattedPrice() }}
      </span>
      @if (hasDiscount()) {
        <span class="text-xs text-gray-400 line-through tabular-nums shrink-0">
          ${{ formattedOldPrice() }}
        </span>
      }
    </div>

    <div class="flex items-center gap-1.5 min-w-0">
      @if (product().shopName) {
        <span class="text-[11px] text-slate-500 font-medium truncate min-w-0" [title]="product().shopName">
          {{ product().shopName }}
        </span>
      }
      <span
        class="inline-flex shrink-0 items-center px-2 py-0.5 rounded text-[9px] font-extrabold uppercase tracking-wide border"
        [style.background-color]="tierStyles().bg"
        [style.color]="tierStyles().color"
        [style.border-color]="tierStyles().border">
        {{ tierLabel() }}
      </span>
    </div>

    <h3
      class="text-[13px] text-slate-900 font-semibold leading-tight truncate whitespace-nowrap group-hover:text-[#E11D2E] transition-colors"
      [title]="fullName()">
      {{ product().name }}
    </h3>

    <p class="text-[11px] text-slate-500 leading-tight truncate whitespace-nowrap h-4" [title]="shortDesc() || ''">
      @if (shortDesc()) {
        {{ shortDesc() }}
      }
    </p>
  </div>
</div>

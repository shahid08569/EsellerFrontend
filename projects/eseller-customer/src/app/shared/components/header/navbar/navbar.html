<header class="bg-primary sticky top-0 z-50 shadow-sm" style="color: white;">

  <!-- ============================================================ -->
  <!-- MAIN ROW: Mobile / Desktop -->
  <!-- ============================================================ -->
  <div class="max-w-7xl mx-auto px-3 md:px-4 py-3 md:py-4">

    <!-- ============ MOBILE LAYOUT (< md) ============ -->
    <div class="flex md:hidden items-center justify-between gap-3">

      <!-- Hamburger -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-md transition-colors"
        aria-label="Toggle menu"
      >
        @if (mobileMenuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>

      <!-- Logo (center) -->
      <a routerLink="/" (click)="closeMobileMenu()" class="text-xl font-bold text-white tracking-tight">
        Eseller
      </a>

      <!-- Right icons -->
      <div class="flex items-center gap-1">
        <a
          routerLink="/wishlist"
          (click)="closeMobileMenu()"
          class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-md transition-colors"
          aria-label="Wishlist"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
          </svg>
        </a>

        <a
          routerLink="/cart"
          (click)="closeMobileMenu()"
          class="w-10 h-10 flex items-center justify-center text-white hover:bg-white/10 rounded-md transition-colors"
          aria-label="Cart"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
          </svg>
        </a>
      </div>

    </div>

    <!-- ============ DESKTOP LAYOUT (>= md) ============ -->
    <div class="hidden md:grid grid-cols-3 items-center gap-4">

      <!-- LEFT: Search -->
      <div class="flex items-center">
        <div class="relative w-full max-w-md">
          <input
            type="text"
            placeholder="Search for products..."
            class="w-full pl-4 pr-10 py-2.5 text-sm bg-white text-text-primary border border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-white/40 transition-colors"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-primary hover:text-primary-hover transition-colors"
            aria-label="Search"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- CENTER: Logo -->
      <div class="flex justify-center">
        <a routerLink="/" class="text-2xl font-bold text-white tracking-tight">
          Eseller
        </a>
      </div>

      <!-- RIGHT: Auth -->
      <div class="flex items-center justify-end gap-3">
        <a
          routerLink="/auth/login"
          class="text-sm font-medium text-white hover:text-white/80 transition-colors"
        >
          Login
        </a>
        <a
          routerLink="/auth/register"
          class="px-4 py-2 text-sm font-semibold !text-primary !bg-white rounded-md hover:!bg-white/90 transition-colors"
        >
          Register
        </a>
        <a
          routerLink="/affiliate/register"
          class="hidden lg:inline text-sm font-medium text-white hover:text-white/80 transition-colors"
        >
          Become Affiliate
        </a>
      </div>

    </div>

  </div>

  <!-- ============================================================ -->
  <!-- MOBILE SEARCH BAR -->
  <!-- ============================================================ -->
  <div class="md:hidden px-3 pb-3">
    <div class="relative w-full">
      <input
        type="text"
        placeholder="Search products..."
        class="w-full pl-4 pr-10 py-2 text-sm bg-white text-text-primary border border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-white/40"
      />
      <button
        type="button"
        class="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-primary"
        aria-label="Search"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- DESKTOP NAV LINE -->
  <!-- ============================================================ -->
  <nav class="hidden md:block border-t border-white/20">
    <div class="max-w-7xl mx-auto px-4 flex items-center gap-8 py-3 text-sm font-medium text-white overflow-x-auto">
      <a routerLink="/" class="text-white hover:text-white/80 transition-colors whitespace-nowrap">Home</a>
      <a routerLink="/categories" class="text-white hover:text-white/80 transition-colors whitespace-nowrap">Categories</a>
      <a routerLink="/brands" class="text-white hover:text-white/80 transition-colors whitespace-nowrap">Brands</a>
      <a routerLink="/blogs" class="text-white hover:text-white/80 transition-colors whitespace-nowrap">Blogs</a>
      <a routerLink="/products" class="text-white hover:text-white/80 transition-colors whitespace-nowrap">All Products</a>

      <div class="ml-auto flex items-center gap-5">
        <a routerLink="/wishlist" class="flex items-center gap-1.5 text-white hover:text-white/80 transition-colors whitespace-nowrap">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
          </svg>
          Wishlist
        </a>
        <a routerLink="/cart" class="flex items-center gap-1.5 text-white hover:text-white/80 transition-colors whitespace-nowrap">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
          </svg>
          Cart
        </a>
      </div>
    </div>
  </nav>

  <!-- ============================================================ -->
  <!-- MOBILE MENU DRAWER — ANIMATED -->
  <!-- ============================================================ -->
  <div
    class="md:hidden bg-primary-active text-white border-t border-white/20 overflow-hidden transition-all duration-300 ease-in-out"
    [class.max-h-0]="!mobileMenuOpen()"
    [class.max-h-[600px]]="mobileMenuOpen()"
    [class.opacity-0]="!mobileMenuOpen()"
    [class.opacity-100]="mobileMenuOpen()"
  >

    <nav class="px-4 py-4 flex flex-col gap-1">
      <a routerLink="/" (click)="closeMobileMenu()" class="py-2.5 px-3 text-white font-medium rounded-md hover:bg-white/10 transition-colors">
        Home
      </a>
      <a routerLink="/categories" (click)="closeMobileMenu()" class="py-2.5 px-3 text-white font-medium rounded-md hover:bg-white/10 transition-colors">
        Categories
      </a>
      <a routerLink="/brands" (click)="closeMobileMenu()" class="py-2.5 px-3 text-white font-medium rounded-md hover:bg-white/10 transition-colors">
        Brands
      </a>
      <a routerLink="/blogs" (click)="closeMobileMenu()" class="py-2.5 px-3 text-white font-medium rounded-md hover:bg-white/10 transition-colors">
        Blogs
      </a>
      <a routerLink="/products" (click)="closeMobileMenu()" class="py-2.5 px-3 text-white font-medium rounded-md hover:bg-white/10 transition-colors">
        All Products
      </a>
    </nav>

    <div class="border-t border-white/20"></div>

    <div class="px-4 py-4 flex flex-col gap-2">
      <a
        routerLink="/auth/login"
        (click)="closeMobileMenu()"
        class="py-2.5 px-3 text-white font-medium rounded-md hover:bg-white/10 transition-colors text-center"
      >
        Login
      </a>
      <a
        routerLink="/auth/register"
        (click)="closeMobileMenu()"
        class="py-2.5 px-3 !text-primary !bg-white font-semibold rounded-md hover:!bg-white/90 transition-colors text-center"
      >
        Register
      </a>
      <a
        routerLink="/affiliate/register"
        (click)="closeMobileMenu()"
        class="py-2.5 px-3 text-white font-medium rounded-md hover:bg-white/10 transition-colors text-center"
      >
        Become Affiliate
      </a>
    </div>

  </div>

</header>

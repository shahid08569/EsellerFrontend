@if (visible().length > 0) {
  <section class="payment-rail w-full border-y border-slate-100 bg-white/90" aria-label="Accepted payment methods">
    <div class="max-w-7xl mx-auto px-3 md:px-4 py-2.5 md:py-3 flex items-center gap-3 md:gap-4">
      <div class="shrink-0 hidden sm:flex flex-col leading-tight">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Payments</span>
        <span class="text-xs font-semibold text-slate-600">We accept</span>
      </div>

      <div class="payment-rail-viewport relative flex-1 min-w-0 overflow-hidden">
        <div class="payment-rail-track flex items-center gap-6 md:gap-10 w-max py-1">
          @for (logo of loopLogos(); track $index) {
            <div class="payment-rail-item flex-shrink-0 h-8 md:h-9 w-[72px] md:w-[88px] flex items-center justify-center opacity-80 hover:opacity-100 transition-opacity">
              @if (mediaUrl(logo.imageUrl); as src) {
                <img
                  [src]="src"
                  [alt]="logo.name || 'Payment method'"
                  class="max-h-full max-w-full object-contain"
                  loading="lazy"
                  draggable="false"
                />
              }
            </div>
          }
        </div>
      </div>
    </div>
  </section>
}

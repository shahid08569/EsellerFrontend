<!-- 1. Hero Carousel (Full-Width Edge-to-Edge Flush under Top Nav) -->
<app-hero-carousel [banners]="banners()" />

<!-- Payment methods showcase (SuperAdmin-managed, infinite auto-scroll) -->
<app-payment-logos-rail [logos]="paymentLogos()" />

<!-- 2. Storefront Main Content (Contained Layout) -->
<div class="max-w-7xl mx-auto px-3 md:px-4 py-8 md:py-12 space-y-10 md:space-y-14">

  <!-- Categories Grid -->
  <app-categories-grid [categories]="categories()" />

  <!-- 3. Flash Sale -->
  <app-flash-sale-section
    [products]="flashSaleProducts()"
    [loading]="loadingFlashSale()"
    viewAllLink="/flash-sales"
  />

  <!-- 4. DYNAMIC CATEGORY SECTIONS (admin-controlled) -->
  @if (loadingCategorySections()) {
    <div class="space-y-10 md:space-y-14">
      @for (i of [1,2,3]; track i) {
        <div class="w-full bg-white rounded-[24px] py-6 md:py-8 px-4 md:px-6 border border-gray-100">
          <es-skeleton-layout variant="product-grid" [count]="5" />
        </div>
      }
    </div>
  }
  @else {
    @for (section of categorySections(); track section.id) {
      <app-category-products-section
        [categoryName]="section.name"
        [categoryImageUrl]="section.imageUrl"
        [viewMoreLink]="'/categories/' + section.slug"
        [products]="section.products"
        [loading]="false"
      />
    }
  }

  <!-- 5. New Arrivals -->
  <app-products-section
    title="New Arrivals"
    viewAllLink="/new-arrivals"
    [products]="newArrivals()"
    [loading]="loadingNewArrivals()"
  />

  <!-- 6. Featured Products -->
  <app-featured-products-slider
    title="Featured Products"
    viewAllLink="/featured"
    [products]="featuredProducts()"
    [loading]="loadingFeatured()"
  />

  <!-- 7. Best Selling -->
  <app-best-selling-section
    title="Best Selling"
    viewAllLink="/best-selling"
    [products]="bestSellingProducts()"
    [loading]="loadingBestSelling()"
  />

  <!-- 8. Hot Selling -->
  <app-hot-selling-section
    title="Hot Selling"
    viewAllLink="/hot-selling"
    [products]="hotSellingProducts()"
    [loading]="loadingHotSelling()"
  />

  <!-- 9. Featured Brands -->
  <app-brands-grid
    title="Featured Brands"
    viewAllLink="/brands"
    [brands]="brands()"
    [limit]="12"
  />

</div>

# Optional Direct Upload via Wrangler.
# Primary deploy = Cloudflare Pages Git integration (Workers & Pages → Deployments).
# These Actions need repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
# Disabled on push so missing secrets do not show false failures.

name: Deploy Admin → Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install & build
        run: |
          npm ci --ignore-engines
          npx ng build eseller-admin --configuration=production
          printf '/*    /index.html   200\n' > dist/eseller-admin/browser/_redirects

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/eseller-admin/browser --project-name=eseller-admin --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

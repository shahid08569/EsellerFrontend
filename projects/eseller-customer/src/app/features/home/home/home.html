<div class="max-w-7xl mx-auto px-3 md:px-4 py-6 md:py-8 space-y-10 md:space-y-14">

  <!-- 1. Hero Carousel -->
  <app-hero-carousel [banners]="banners()" />

  <!-- 2. Categories Grid -->
  <app-categories-grid [categories]="categories()" />

  <!-- 3. Flash Sale -->
  <app-flash-sale-section
    [products]="flashSaleProducts()"
    [loading]="loadingFlashSale()"
    viewAllLink="/products"
  />

  <!-- 4. DYNAMIC CATEGORY SECTIONS (admin-controlled) -->
  @if (loadingCategorySections()) {
    <!-- Skeleton for category sections -->
    <div class="space-y-10 md:space-y-14">
      @for (i of [1,2,3]; track i) {
        <div class="w-full bg-white rounded-[24px] py-6 md:py-8 px-4 md:px-6 border border-gray-100">
          <div class="mb-6 md:mb-8">
            <div class="h-8 md:h-10 bg-gray-200 rounded w-1/3 mb-2 animate-pulse"></div>
            <div class="w-16 md:w-20 h-1 bg-gray-200 rounded-full animate-pulse"></div>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
            @for (j of [1,2,3,4,5]; track j) {
              <div class="bg-white rounded-lg border border-gray-200 overflow-hidden animate-pulse">
                <div class="aspect-square bg-gray-200"></div>
                <div class="p-4 space-y-2">
                  <div class="h-5 bg-gray-200 rounded w-1/2"></div>
                  <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                  <div class="h-4 bg-gray-200 rounded w-2/3"></div>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  }
  @else {
    @for (section of categorySections(); track section.id) {
      <app-category-products-section
        [categoryName]="section.name"
        [viewMoreLink]="'/categories/' + section.slug"
        [products]="section.products"
        [loading]="false"
      />
    }
  }

  <!-- 5. New Arrivals -->
  <app-products-section
    title="New Arrivals"
    viewAllLink="/products"
    [products]="newArrivals()"
    [loading]="loadingNewArrivals()"
  />

  <!-- 6. Featured Products -->
  <app-featured-products-slider
    title="Featured Products"
    viewAllLink="/products"
    [products]="featuredProducts()"
    [loading]="loadingFeatured()"
  />

  <!-- 7. Best Selling -->
  <app-best-selling-section
    title="Best Selling"
    viewAllLink="/products?sortBy=popular"
    [products]="bestSellingProducts()"
    [loading]="loadingBestSelling()"
  />

  <!-- 8. Hot Selling -->
  <app-hot-selling-section
    title="Hot Selling"
    viewAllLink="/products?sortBy=popular"
    [products]="hotSellingProducts()"
    [loading]="loadingHotSelling()"
  />

  <!-- 9. Featured Brands -->
  <app-brands-grid
    title="Featured Brands"
    viewAllLink="/brands"
    [brands]="brands()"
    [limit]="12"
  />

</div>
